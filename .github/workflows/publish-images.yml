# Manual only: publishes the engine and viewer images to GHCR.
# Run from the Actions tab ("Publish images" -> "Run workflow"), choosing this branch and a tag.
name: Publish images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (compose pulls "dev" by default)
        required: true
        default: dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/flpoly-jetson-one-aerial-policing

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: astrosim-engine
            file: container/Containerfile
          - name: astrosim-viewer
            file: host/Containerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ inputs.tag }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
